# 배달앱 리뷰 답글 자동화 SaaS - Spring Boot 운영 설정
# 로컬 기본 포트: Postgres 5433 / Redis 6380 (호스트의 5432·6379는 타 프로젝트 점유)
# 모든 민감값은 환경변수로 주입한다. 자격증명은 절대 평문으로 커밋하지 않는다.
server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/storemanager}
    username: ${DB_USERNAME:storemanager}
    password: ${DB_PASSWORD:storemanager}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리. Hibernate는 검증만 수행
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

ai:
  # Spring → Python 내부 API base URL (CLAUDE.md 서비스 경계: /internal/ai/analyze-and-draft 하나만 호출)
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}

app:
  admin:
    # 관리자 계정 public UUID. 쉼표 구분 허용목록이며 기본값은 비어 있어 누구도 접근할 수 없다.
    user-ids: ${APP_ADMIN_USER_IDS:}
  scheduler:
    publish:
      # 게시 스케줄러(S9) 활성화 여부. 테스트 프로파일은 이 값을 설정하지 않아 기본적으로 꺼진다.
      enabled: ${PUBLISH_SCHEDULER_ENABLED:true}
    draft:
      # 답글 생성 스케줄러. 끄면 수집만 되고 답글은 하나도 생성되지 않는다.
      # ★ 켜면 LLM 비용이 발생한다. 프롬프트를 바꾼 직후에는 잠시 내려두고 확인하는 편이 안전하다.
      enabled: ${DRAFT_SCHEDULER_ENABLED:true}
    retention:
      # 개인정보 보유기간 경과분 파기(개인정보보호법 제21조). 운영에서는 반드시 켠다.
      # ★ 끄면 보유기간을 정해 두고 실제로는 영구 보관하게 된다.
      enabled: ${RETENTION_SCHEDULER_ENABLED:true}
    billing:
      # 청구·미납 배치(B3/B4) 활성화 여부. 테스트 프로파일은 false 로 재정의한다.
      # 자체 계좌이체 청구는 폐기됐다. Groble 상태 동기화 구현 전까지 절대 실행하지 않는다.
      enabled: ${BILLING_SCHEDULER_ENABLED:false}
  billing:
    # 계좌이체 입금 안내 정보(docs/13 §9). 실제 계좌번호는 절대 커밋하지 않는다 — 기본값 없음, 미설정 시 부팅 실패.
    # 레거시 자체 계좌이체 서비스가 제거될 때까지 빈 기본값으로만 유지한다.
    bank-name: ${BILLING_BANK_NAME:}
    account-no: ${BILLING_ACCOUNT_NO:}
    account-holder: ${BILLING_ACCOUNT_HOLDER:}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 1209600
  crypto:
    # KMS 봉투암호화용 마스터키. LOGINPWD 등 자격증명은 이 키로 감싼 DEK로만 암호화한다.
    master-key: ${CREDENTIAL_MASTER_KEY}
    key-id: ${CREDENTIAL_KEY_ID:local-dev}
    # 교체 이전 마스터키들. "id:base64키" 를 쉼표로 나열한다. 복호화에만 쓴다.
    # ★ 키를 교체할 때 옛 키를 여기 남기지 않으면 기존 자격증명을 전부 못 읽는다.
    #   순서: 새 키를 현재 키로 올리고 옛 키를 여기 남긴다 → 전 행이 재암호화된 뒤 옛 키 제거.
    previous-keys: ${CREDENTIAL_PREVIOUS_KEYS:}
    # 운영 배포에서는 true로 설정해야 하며, 실제 KMS 어댑터 도입 전에는 기동을 허용하지 않는다.
    require-kms: ${CREDENTIAL_REQUIRE_KMS:false}
  business:
    # 전자상거래법 제10조 표시사항. ★ 정본은 BusinessInfoProperties 하나다 —
    #   화면·약관에 사업자등록번호를 따로 적지 말 것.
    # ★ 사업자 등록이 나오면 아래 값을 채우고 BUSINESS_INFO_REQUIRED=true 로 켠다.
    #   켜 두면 값이 하나라도 비었을 때 기동하지 않는다(fail-closed).
    name: ${BUSINESS_NAME:소담}
    service-name: ${BUSINESS_SERVICE_NAME:리뷰파일럿}
    representative: ${BUSINESS_REPRESENTATIVE:}
    address: ${BUSINESS_ADDRESS:}
    phone: ${BUSINESS_PHONE:}
    email: ${BUSINESS_EMAIL:}
    registration-number: ${BUSINESS_REGISTRATION_NUMBER:}
    mail-order-number: ${BUSINESS_MAIL_ORDER_NUMBER:}
    privacy-officer: ${BUSINESS_PRIVACY_OFFICER:}
    require-complete: ${BUSINESS_INFO_REQUIRED:false}
  internal:
    # Worker → Spring 내부 API(POST /internal/collect-result) 공유 시크릿. 기본값을 두지 않는다.
    token: ${INTERNAL_TOKEN}
  alimtalk:
    # 카카오 알림톡 발송(솔라피). 1차로 사람 확인이 필요한 고위험 리뷰만 보낸다.
    #
    # ★ 기본값은 false 다. DATAAPI_WRITE_ENABLED 와 같은 이유 — 알림톡은 되돌릴 수 없고,
    #   실수 한 번이 실고객 카카오톡으로 나간다. 켜는 것은 사람의 명시적 결정이어야 한다.
    enabled: ${ALIMTALK_ENABLED:false}
    # 솔라피 API 자격증명. 기본값을 두지 않는다 — enabled=true 인데 키가 없으면 기동을 막는다.
    # ★ 절대규칙 5 와 같은 취급이다. 로그·예외 메시지에 절대 싣지 말 것.
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    # 카카오 발신프로필 ID(pfId). 채널당 하나이며 솔라피 콘솔에서 발급한다.
    pf-id: ${SOLAPI_PF_ID:}
    # 솔라피에 사전 등록된 발신번호. 현재는 disableSms=true라 문자 대체발송에는 사용하지 않는다.
    sender-phone: ${SOLAPI_SENDER_PHONE:}
    # SOLAPI 웹훅 등록 시 지정한 공유 비밀. 헤더로 오는 SHA-1 값과 상수시간 비교한다.
    webhook-secret: ${SOLAPI_WEBHOOK_SECRET:}
    # 승인된 템플릿 ID. 카카오는 사전 승인된 템플릿에 변수만 치환해 보낸다 —
    # 문구를 임의로 바꾸면 발송이 거부된다. 템플릿을 고치면 이 ID 도 함께 바꿔야 한다.
    template:
      risk-review: ${SOLAPI_TEMPLATE_RISK_REVIEW:}
      daily-briefing: ${SOLAPI_TEMPLATE_DAILY_BRIEFING:}
    # 알림톡 버튼이 여는 로그인 보호 리뷰 목록의 기준 주소.
    link-base-url: ${ALIMTALK_LINK_BASE_URL:http://localhost:5173}
  privacy:
    # 리뷰 작성자 닉네임 가명처리(author_hash) salt. 미설정 시 부팅 실패가 안전하다 — 기본값을 두지 않는다.
    salt: ${AUTHOR_HASH_SALT}
    # 리뷰 개인정보 보유기간(일). 기본 3년 — docs/17 개인정보처리방침과 반드시 같아야 한다.
    # ★ 방침에 적은 기간보다 길게 두면 그 자체가 위반이다. 한쪽만 고치지 말 것.
    retention-days: ${PRIVACY_RETENTION_DAYS:1095}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: info   # 파라미터 바인딩 로그(DEBUG)는 자격증명 노출 위험이 있어 올리지 않는다
