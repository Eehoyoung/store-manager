# Testcontainers 통합 테스트용 최소 설정
# 실제 DB/Redis 연결 정보는 Testcontainers가 동적으로 주입하므로 datasource는 지정하지 않는다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  scheduler:
    publish:
      # ★ S9: 테스트 프로파일에서는 게시 스케줄러를 끈다. application.yml 이 기본값을 true 로 주므로
      # (프로파일 병합 시 여기서 재정의하지 않으면 상속됨) 여기서 명시적으로 false 를 지정해야 한다.
      # 끄지 않으면 @Scheduled 가 IT 컨텍스트 기동 직후 실행되며 테스트와 무관한 Redis/DB 접근이 섞인다.
      enabled: false
    billing:
      # ★ B3/B4: 같은 이유로 청구·미납 배치도 끈다. 테스트는 BillingService 메서드를 직접 호출한다.
      enabled: false
  billing:
    # 테스트 전용 더미 계좌 정보 - 운영 값 아님
    bank-name: 테스트은행
    account-no: "000-0000-0000"
    account-holder: 테스트예금주
  jwt:
    # 테스트 전용 더미 시크릿(base64, 32바이트) - 운영 값 아님
    secret: /HbJWF+hl5rgq8axtp6NmSqJlE3UL7WDQmT2PswcCNg=
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 1209600
  crypto:
    # 테스트 전용 더미 마스터키(base64, 32바이트) - 운영 값 아님
    master-key: K/tAaCqZxldEye4SHcdQWB1so2ySJybU3mJfvDDpZ0g=
    key-id: test-key
  internal:
    # 테스트 전용 더미 토큰 - 운영 값 아님
    token: test-internal-token
  privacy:
    # 테스트 전용 더미 salt - 운영 값 아님
    salt: test-privacy-salt
