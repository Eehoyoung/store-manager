# 운영 배포 Compose.
#
# 루트의 docker-compose.yml 은 개발용이다. 그것과의 차이가 이 파일의 존재 이유다.
#   - DB·Redis 포트를 호스트에 열지 않는다 (개발용은 5433/6380 을 연다)
#   - Caddy 가 유일한 외부 노출 지점이다. 80/443 만 열린다
#   - 모든 서비스에 재시작 정책과 로그 상한이 있다
#   - 백업 컨테이너가 매일 돈다
#   - 비밀값은 .env 가 아니라 배포 환경의 시크릿에서 주입한다
#
# 실행:  docker compose -f deploy/docker-compose.prod.yml --env-file /etc/storemanager/env up -d
#
# ★ 이 파일과 같은 디렉터리에 .env 를 두지 말 것. 비밀값은 저장소 밖에 둔다.

name: storemanager-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    # ★ 443 만 연다. 80→443 리다이렉트는 Cloudflare 'Always Use HTTPS' 가 한다.
    #   Lightsail 방화벽에서 443 은 Cloudflare IP 대역만 허용한다(README §1.2).
    ports:
      - "443:443"
    environment:
      SITE_DOMAIN: review.sodamlabs.kr
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA 인증서·키. 저장소 밖(서버)에 둔다 — 키는 600.
      - /etc/storemanager/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - api-spring
      - web

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    # ★ 포트를 열지 않는다. 개발용과의 가장 중요한 차이다 —
    #   자격증명 암호문과 리뷰 원문이 들어 있는 DB 를 인터넷에 노출하지 않는다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # appendonly: 게시 큐·분산락·호출 예산 카운터가 여기 있다. 재시작으로 잃으면 안 된다.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-spring:
    build:
      context: ../api-spring
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ai-python: {condition: service_started}
    # 운영 콘솔 collector 전용. 관리 포트(8081)만 호스트 루프백에 연다 — 앱 포트 8080 은 게시하지 않는다.
    # 외부 노출은 여전히 Caddy 80/443 뿐이다.
    ports:
      - "127.0.0.1:18080:8081"
    environment:
      # 운영 콘솔 연동(2026-09-26): 한 줄 JSON 로그 + 관리 포트 분리 + actuator metrics.
      # 관리 포트를 분리하면 8080 의 /actuator/** 는 404 가 된다(Caddy 404 도 유지).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-python:8001
      # Caddy 가 같은 오리진으로 넘기므로 교차 오리진 요청이 없다.
      APP_CORS_ALLOWED_ORIGINS: https://review.sodamlabs.kr
      # 운영 확장은 Chrome Web Store 의 고정 ID 하나만 허용한다.
      # ★ 비어 있으면 확장 오리진을 하나도 허용하지 않는다(fail-closed) — 배달만 먼저 출시(2026-09-28).
      #   빈 문자열은 Spring 기본값(chrome-extension://*)으로 떨어지지 않는다. `:-` 를 `-` 로 바꾸지 말 것.
      APP_CORS_ALLOWED_EXTENSION_ORIGINS: ${PRODUCTION_EXTENSION_ORIGIN:-}
      JWT_SECRET: ${JWT_SECRET:?}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?}
      CREDENTIAL_KEY_ID: ${CREDENTIAL_KEY_ID:-prod}
      # ★ 운영에서는 true. KMS 어댑터가 준비되기 전에는 기동이 차단된다 — 의도된 것이다.
      CREDENTIAL_REQUIRE_KMS: ${CREDENTIAL_REQUIRE_KMS:-false}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      AUTHOR_HASH_SALT: ${AUTHOR_HASH_SALT:?}
      # 시스템 관리자·가맹본부 담당자 이메일 OTP 발송(docs/26a). 운영은 MAIL_REQUIRED=true —
      # 계정이 비면 기동을 막는다(fail-closed).
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REQUIRED: ${MAIL_REQUIRED:-true}
      # 가맹본부 개별 리뷰 조회. 법무 검토·재동의 화면 전까지 false 로 둔다.
      HQ_REVIEW_ACCESS_ENABLED: ${HQ_REVIEW_ACCESS_ENABLED:-false}
      BUSINESS_VERIFICATION_ENABLED: ${BUSINESS_VERIFICATION_ENABLED:-true}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY:?}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:?}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID:?}
      PORTONE_INICIS_CHANNEL_KEY: ${PORTONE_INICIS_CHANNEL_KEY:?}
      # 사업자 정보(전자상거래법 제10조). ★ BUSINESS_INFO_REQUIRED=true 면 값이 비면 기동을 막는다.
      BUSINESS_NAME: 소담랩스
      BUSINESS_SERVICE_NAME: 소담리뷰
      BUSINESS_REPRESENTATIVE: 이호영
      BUSINESS_ADDRESS: 경기도 고양시 덕양구 화정로 53-1, 709-가1호
      BUSINESS_PHONE: 010-9352-3827
      BUSINESS_EMAIL: sodamlabs@gmail.com
      BUSINESS_REGISTRATION_NUMBER: 358-23-02207
      # ★ 통신판매업 신고 대기 중(2026-09-28). 무료 파일럿 동안은 비워 두고(화면에 "신고 후 표시"),
      #   신고번호가 나오면 env 에 넣고 BUSINESS_INFO_REQUIRED=true 로 켠 뒤에야 유료 결제를 연다.
      BUSINESS_MAIL_ORDER_NUMBER: ${BUSINESS_MAIL_ORDER_NUMBER:-}
      BUSINESS_PRIVACY_OFFICER: 이호영
      BUSINESS_INFO_REQUIRED: ${BUSINESS_INFO_REQUIRED:-false}
      # 카카오 알림톡(솔라피). ★ ALIMTALK_ENABLED 기본 false — 알림톡은 되돌릴 수 없다.
      ALIMTALK_ENABLED: ${ALIMTALK_ENABLED:-false}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_PF_ID: ${SOLAPI_PF_ID:-}
      SOLAPI_SENDER_PHONE: ${SOLAPI_SENDER_PHONE:-}
      SOLAPI_TEMPLATE_RISK_REVIEW: ${SOLAPI_TEMPLATE_RISK_REVIEW:-}
      SOLAPI_TEMPLATE_DAILY_BRIEFING: ${SOLAPI_TEMPLATE_DAILY_BRIEFING:-}
      ALIMTALK_LINK_BASE_URL: https://review.sodamlabs.kr
      PRIVACY_RETENTION_DAYS: ${PRIVACY_RETENTION_DAYS:-1095}
      PUBLISH_SCHEDULER_ENABLED: ${PUBLISH_SCHEDULER_ENABLED:-true}
      DRAFT_SCHEDULER_ENABLED: ${DRAFT_SCHEDULER_ENABLED:-true}
      # ★ 개인정보 파기 배치. 운영에서 끄면 보유기간을 정해 두고 영구 보관하게 된다.
      RETENTION_SCHEDULER_ENABLED: ${RETENTION_SCHEDULER_ENABLED:-true}
      BILLING_SCHEDULER_ENABLED: ${BILLING_SCHEDULER_ENABLED:-false}
      # 무료체험 쿠폰번호(비공개, 개별 전달). 비면 체험을 열지 않는다.
      PROMOTION_CODE: ${PROMOTION_CODE:-}
      PROMOTION_LIMIT: ${PROMOTION_LIMIT:-30}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai-python:
    build:
      context: ../ai-python
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 골든셋 평가는 운영에서 자동으로 돌지 않는다 (1회 약 1,500원).
      GOLDENSET_EVAL_ENABLED: ${GOLDENSET_EVAL_ENABLED:-false}

  worker:
    build:
      context: ../worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      api-spring: {condition: service_started}
    environment:
      REDIS_URL: redis://redis:6379/0
      SPRING_INTERNAL_URL: http://api-spring:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      # 기본은 운영계다. 테스트 배포(2026-09-28~)는 서버 env 에서 개발계로 덮어쓴다:
      #   DATAAPI_BASE_URL=https://datahub-dev.scraping.co.kr
      # ★ 개발계도 실제 배달앱 계정으로 로그인한다 — 등록을 켜면 실매장 리뷰에 답글이 달린다.
      DATAAPI_BASE_URL: ${DATAAPI_BASE_URL:-https://api.mydatahub.co.kr}
      DATAAPI_TOKEN: ${DATAAPI_TOKEN:?}
      # ★ 운영은 켠다(2026-09-28 — 배민·요기요·쿠팡이츠 등록 실호출 성공 확인).
      #   댓글 등록은 되돌릴 수 없다. 사고 시 env 에 false 를 넣고 worker 만 재기동하면 멈춘다.
      #   개발 Compose 는 false 기본값을 그대로 둔다.
      DATAAPI_WRITE_ENABLED: ${DATAAPI_WRITE_ENABLED:-true}
      DATAAPI_ENC_SPEC: ${DATAAPI_ENC_SPEC:?}
      DATAAPI_ENC_KEY: ${DATAAPI_ENC_KEY:?}
      DATAAPI_ENC_IV: ${DATAAPI_ENC_IV:?}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?}
      # 0 = 무제한. 테스트 토큰을 쓸 때만 잔여 횟수를 넣는다.
      DATAAPI_CALL_BUDGET: ${DATAAPI_CALL_BUDGET:-0}

  web:
    build:
      context: ../web
      args:
        # 같은 오리진이므로 상대 경로면 충분하다 — 도메인이 바뀌어도 다시 빌드할 필요가 없다.
        VITE_API_BASE_URL: /api/v1
        VITE_GROBLE_PAYMENT_URL: ${VITE_GROBLE_PAYMENT_URL:-}
    restart: unless-stopped
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backup
    # ★ 매일 03:00(UTC 18:00 = KST 03:00) 백업. 청구·파기 배치보다 앞에 둔다 —
    #   배치가 데이터를 바꾸기 전 상태를 남겨야 사고 시 되돌릴 수 있다.
    entrypoint: >
      sh -c 'while true; do
        now=$$(date -u +%H%M);
        if [ "$$now" = "1800" ]; then /backup.sh || echo "[backup] 실패"; sleep 3600; fi;
        sleep 30;
      done'

volumes:
  pgdata:
  redisdata:
  caddy-data:
  caddy-config:
  caddy-logs:
